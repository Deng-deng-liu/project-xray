[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "project-xray"
version = "0.3.0"
description = "Evidence-linked project X-ray for Java/Spring Boot interview preparation"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Project Xray contributors" }]
keywords = ["interview", "java", "spring-boot", "static-analysis", "code-evidence"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
  "Pillow>=10.0",
  "Pygments>=2.15",
]

[project.scripts]
project-xray = "project_xray.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
